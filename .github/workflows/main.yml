name: TradeBot Autopilot

on:
  schedule:
    - cron: '17 * * * *'  # Runs at 17 minutes past every hour, dodging the `:00` queue rush
  workflow_dispatch: # Allows you to run it manually from GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pandas websocket-client

      - name: Run TradeBot Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
